# docker-compose.yml — Local development environment
#
# Usage:
#   docker compose up          # start
#   docker compose up --build  # rebuild and start
#   docker compose down        # stop and remove containers

version: '3.9'

services:
  app:
    # Build the image from our Dockerfile in the backend/ directory
    build:
      context: ./backend
      dockerfile: ../Dockerfile

    # Map container port 8080 to host port 8080
    # Access the app at: http://localhost:8080
    ports:
      - "8080:8080"

    # Environment variables — override any .env settings
    # In production these come from ECS Task Definition, not docker-compose
    environment:
      - PORT=8080
      - ENV=development
      - DB_PATH=/data/todos.db
      - JWT_SECRET=local-dev-secret-change-in-production-at-least-32-chars
      - JWT_EXPIRY=24h
      - ALLOWED_ORIGINS=http://localhost:8080
      - RATE_LIMIT_RPS=100

    # Mount a volume so the SQLite database file persists between container restarts.
    # Without this, every 'docker compose down' would wipe your data.
    volumes:
      - todo-data:/data

    # Restart the container if it crashes (but not if you manually stop it)
    restart: unless-stopped

    # Health check mirrors the Dockerfile HEALTHCHECK
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Named volume for SQLite database persistence
volumes:
  todo-data:
    driver: local
